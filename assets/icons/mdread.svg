<?xml version="1.0" encoding="UTF-8"?>
<!-- mdread application icon (GNOME HIG style, 128x128 grid). -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaedf1"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#c9d1da"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8bf8"/>
      <stop offset="1" stop-color="#0757c2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <!-- soft shadow under the page -->
  <path d="M26,10 H84 L108,34 V116 a6,6 0 0 1 -6,6 H26 a6,6 0 0 1 -6,-6 V16 a6,6 0 0 1 6,-6 Z" fill="#000" opacity="0.25" filter="url(#shadow)"/>
  <!-- page with folded corner -->
  <path d="M26,8 H84 L108,32 V114 a6,6 0 0 1 -6,6 H26 a6,6 0 0 1 -6,-6 V14 a6,6 0 0 1 6,-6 Z" fill="url(#paper)" stroke="#a5aebb" stroke-width="1"/>
  <path d="M84,8 V26 a6,6 0 0 0 6,6 H108 Z" fill="url(#fold)" stroke="#a5aebb" stroke-width="1" stroke-linejoin="round"/>
  <!-- Markdown badge: M with a down arrow -->
  <rect x="30" y="32" width="68" height="44" rx="7" fill="url(#badge)"/>
  <rect x="30.5" y="32.5" width="67" height="43" rx="6.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="butt">
    <path d="M39.5,67 V42.5 L52,56 L64.5,42.5 V67"/>
    <path d="M83,41.5 V66"/>
    <path d="M73.5,57 L83,66.5 L92.5,57" stroke-linecap="round"/>
  </g>
  <!-- body text lines -->
  <g stroke="#c5ccd5" stroke-width="5" stroke-linecap="round">
    <path d="M34,89 H94"/>
    <path d="M34,100 H94"/>
    <path d="M34,111 H72"/>
  </g>
</svg>
