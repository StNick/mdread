<?xml version="1.0" encoding="UTF-8"?>
<!-- mdread application icon, simplified for 16-24 px (16x16 grid). -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8bf8"/>
      <stop offset="1" stop-color="#0757c2"/>
    </linearGradient>
  </defs>
  <!-- page with folded corner -->
  <path d="M3.5,1.5 H10.5 L13.5,4.5 V13.5 a1,1 0 0 1 -1,1 H3.5 a1,1 0 0 1 -1,-1 V2.5 a1,1 0 0 1 1,-1 Z" fill="#fff" stroke="#8d97a5" stroke-width="1"/>
  <path d="M10.5,1.5 V3.5 a1,1 0 0 0 1,1 H13.5 Z" fill="#d6dce3" stroke="#8d97a5" stroke-width="1" stroke-linejoin="round"/>
  <!-- badge with M -->
  <rect x="4" y="6" width="8" height="6" rx="1" fill="url(#badge)"/>
  <path d="M5.5,11 V7.5 L8,10 L10.5,7.5 V11" fill="none" stroke="#fff" stroke-width="1.25" stroke-linejoin="round"/>
</svg>
